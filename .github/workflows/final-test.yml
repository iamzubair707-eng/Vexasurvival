name: Final Game Script Check

on:
  push:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check C# files exist
      run: |
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📁 GAME SCRIPTS VERIFICATION"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        
        cd Scripts
        ls -la *.cs | wc -l
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        
        for file in *.cs; do
          LINES=$(wc -l < "$file")
          echo "✅ $file - $LINES lines"
        done
        
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🎮 All game systems are ready!"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    
    - name: Check for common Unity syntax
      run: |
        echo "🔍 Checking Unity-specific syntax..."
        
        cd Scripts
        
        # Check for Header attributes (optional, not errors)
        grep -l "\[Header" *.cs | xargs -I {} echo "⚠️ Has Header attribute: {}" || echo "✅ No Header attributes found"
        
        # Check for required using statements
        for file in *.cs; do
          if ! grep -q "using UnityEngine" "$file"; then
            echo "❌ Missing UnityEngine using in: $file"
            exit 1
          fi
        done
        
        echo "✅ All files have proper using statements"
    
    - name: Final status
      run: |
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🎉 GAME DEVELOPMENT STATUS 🎉"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "✅ All scripts are in place"
        echo "✅ Ready for Unity Editor import"
        echo "✅ Total systems: 14"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"