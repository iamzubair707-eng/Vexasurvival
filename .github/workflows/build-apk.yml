name: Build Vexa Survival APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          buildName: VexaSurvival
          buildsPath: build
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VexaSurvival-APK
          path: build/*.apk
